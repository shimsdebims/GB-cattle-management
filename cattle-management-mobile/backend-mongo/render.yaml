services:
  - type: web
    name: gb-cattle-backend
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000           # Render sets PORT automatically; this is a fallback
      - key: MONGODB_URI
        sync: false           # Set manually in Render dashboard – never commit the real URI
      # Login. Leave AUTH_REQUIRED=false until both apps ship the login screen,
      # then set it to true. AUTH_SECRET: 32+ random characters, never reused.
      - key: AUTH_REQUIRED
        value: "false"
      - key: AUTH_SECRET
        generateValue: true
      # Creates the owner account on first boot if no user exists yet.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
