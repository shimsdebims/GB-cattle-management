name: CI

# Every push and pull request must pass before it reaches main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (in-memory MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cattle-management-mobile/backend-mongo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cattle-management-mobile/backend-mongo/package-lock.json
      - run: npm ci
      - run: npm test

  app:
    name: Mobile app typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cattle-management-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cattle-management-mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # The iPhone runs this web build, so it must keep building.
      - name: Web export (what Vercel serves to the iPhone)
        run: npx expo export -p web

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: false
